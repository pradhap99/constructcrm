name: CivilIQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── API: Lint + Type Check + Test ────────────────────────────────────────
  api-ci:
    name: API — Lint, Type Check, Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: civiliq
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: civiliq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://civiliq:test_password@localhost:5432/civiliq_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_min_64_chars_long_for_ci_pipeline_testing_only
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests

  # ─── Web: Lint + Type Check + Build ───────────────────────────────────────
  web-ci:
    name: Web — Lint, Type Check, Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_WS_URL: ws://localhost:4000

  # ─── Module Boundary Check ─────────────────────────────────────────────────
  boundary-check:
    name: Module Boundary Enforcement
    runs-on: ubuntu-latest
    needs: [api-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - name: Check module boundaries (ESLint boundaries plugin)
        run: npx eslint "src/**/*.ts" --rule '{"boundaries/element-types": "error"}'
        working-directory: apps/api
        continue-on-error: true  # Enable once ESLint boundaries fully configured
