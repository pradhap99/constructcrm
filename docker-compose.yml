version: '3.9'

services:
  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civiliq_postgres
    environment:
      POSTGRES_USER: civiliq
      POSTGRES_PASSWORD: civiliq_dev_password
      POSTGRES_DB: civiliq_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U civiliq -d civiliq_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: civiliq_redis
    command: redis-server --appendonly yes --requirepass civiliq_redis_password
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', 'civiliq_redis_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── BullMQ Dashboard (Bull Board) ───────────────────────────────────────
  bull-board:
    image: deadly0/bull-board
    container_name: civiliq_bullboard
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: civiliq_redis_password
    ports:
      - '3010:3000'
    depends_on:
      redis:
        condition: service_healthy

  # ─── API (NestJS) ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: civiliq_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://civiliq:civiliq_dev_password@postgres:5432/civiliq_dev
      REDIS_URL: redis://:civiliq_redis_password@redis:6379
      NODE_ENV: development
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

  # ─── Web (Next.js) ────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: civiliq_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
